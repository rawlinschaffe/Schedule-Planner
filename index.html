<style>

function buildNewMeetingDateTime(){
  const base=new Date((newDate||todayDateStr())+'T00:00');
  const yearDigits=String(newYear||'').replace(/\D/g,'');
  let y;
  if(!yearDigits||yearDigits==='20')y=base.getFullYear();
  else if(yearDigits.length===2)y=2000+parseInt(yearDigits,10);
  else if(yearDigits.length===4)y=parseInt(yearDigits,10);
  else return '';
  const mo=parseInt(newMonth||String(base.getMonth()+1),10);
  const da=parseInt(newDay||String(base.getDate()),10);
  const hrRaw=String(newHour||'').trim();
  if(!hrRaw)return '';
  let hr=parseInt(hrRaw,10), mi=parseInt(String(newMinute||'0'),10);
  if(!Number.isFinite(y)||!Number.isFinite(mo)||!Number.isFinite(da)||!Number.isFinite(hr)||hr<1||hr>12)return '';
  if(!Number.isFinite(mi)||mi<0||mi>59)mi=0;
  let hh=hr%12;if(newAMPM==='PM')hh+=12;
  const pad=n=>String(n).padStart(2,'0');
  return y+'-'+pad(mo)+'-'+pad(da)+'T'+pad(hh)+':'+pad(mi);
}
function generateRecurringMeetings(){
  if(!D||!Array.isArray(D.meetings))return;
  const now=new Date();let changed=false;
  for(const m of [...D.meetings]){
    if(!m.recurringWeekly)continue;
    const d=new Date(m.date);if(isNaN(d)||d>=now)continue;
    const sourceId=m.recurringSourceId||m.id;
    let next=new Date(d);
    while(next<now)next.setDate(next.getDate()+7);
    const nextIso=next.toISOString().slice(0,16);
    const key=sourceId+':'+nextIso;
    if(D.meetings.some(x=>x.recurringInstanceKey===key||((x.recurringSourceId||x.id)===sourceId&&x.date===nextIso)))continue;
    D.meetings.push({...m,id:uid(),date:nextIso,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),googleEventId:null,googleCalendarId:null,googleUpdatedAt:null,lastSyncedAt:null,syncConflict:false,conflictReason:'',recurringWeekly:true,recurringSourceId:sourceId,recurringInstanceKey:key,notes:cloneNotes(m.notes||[])});
    changed=true;
  }
  if(changed)sv();
}

async function refreshGoogleSyncOptions(){
  if(!ensureGoogleReady())return false;
  try{
    normalizeSettings();
    const calRes=await gapi.client.calendar.calendarList.list({minAccessRole:"reader",showHidden:false});
    const raw=(calRes.result.items||[]).filter(c=>!c.deleted&&c.accessRole!=="freeBusyReader");
    const cals=raw.map(c=>({
      id:c.primary?"primary":c.id,
      actualId:c.id,
      summary:c.primary?(c.summary||"Primary"):(c.summary||c.id),
      primary:!!c.primary,
      backgroundColor:c.backgroundColor||"",
      foregroundColor:c.foregroundColor||""
    }));
    const finalCals=cals.length?cals:[{id:"primary",actualId:"primary",summary:"Primary",primary:true}];
    let stats={},usedColorIds=new Set(),availableCals=[];
    for(const cal of finalCals){
      let events=[];
      try{events=await listGoogleEventsForCalendar(cal);}catch(err){console.warn("Could not scan calendar",cal,err);}
      const colorCounts={};
      for(const ev of events){
        const id=getGoogleEventColorId(ev);
        colorCounts[id]=(colorCounts[id]||0)+1;
        usedColorIds.add(id);
      }
      if(events.length>0||cal.primary){
        stats[cal.id]={total:events.length,colorCounts};
        availableCals.push({...cal,eventCount:events.length});
      }
    }
    if(!availableCals.find(c=>c.id==="primary")){
      const p=finalCals.find(c=>c.primary)||{id:"primary",actualId:"primary",summary:"Primary",primary:true};
      stats[p.id]=stats[p.id]||{total:0,colorCounts:{}};
      availableCals.unshift({...p,eventCount:0});
    }
    SETT.googleCalendars=availableCals;
    SETT.googleCalendarStats=stats;
    const existingCalIds=new Set(availableCals.map(c=>c.id));
    SETT.googleImportCalendarIds=(SETT.googleImportCalendarIds||["primary"]).filter(id=>existingCalIds.has(id));
    if(!SETT.googleImportCalendarIds.length)SETT.googleImportCalendarIds=[existingCalIds.has("primary")?"primary":availableCals[0].id];
    const colorRes=await gapi.client.calendar.colors.get();
    const googleColors=colorRes.result.event||{};
    const selectedCalIds=new Set(SETT.googleImportCalendarIds||["primary"]);
    const visibleColorIds=new Set();
    for(const cid of selectedCalIds){
      const cc=stats[cid]?.colorCounts||{};
      Object.keys(cc).forEach(id=>visibleColorIds.add(id));
    }
    const dynamic=[...visibleColorIds].sort((a,b)=>{
      if(a==="default")return -1;if(b==="default")return 1;return Number(a)-Number(b);
    }).map(id=>({
      id,
      name:colorLabel(id),
      count:[...selectedCalIds].reduce((sum,cid)=>sum+(stats[cid]?.colorCounts?.[id]||0),0),
      background:googleColors[id]?.background||"",
      foreground:googleColors[id]?.foreground||""
    }));
    SETT.googleEventColors=dynamic;
    const visibleIds=new Set(dynamic.map(c=>c.id));
    const hadSelection=Array.isArray(SETT.googleImportColorIds)&&SETT.googleImportColorIds.length>0;
    SETT.googleImportColorIds=(SETT.googleImportColorIds||[]).filter(id=>visibleIds.has(id));
    if(!hadSelection&&dynamic.length)SETT.googleImportColorIds=dynamic.map(c=>c.id);
    SETT.googleOptionsLoadedAt=new Date().toISOString();
    await saveSett();render();
    const total=availableCals.reduce((sum,c)=>sum+(c.eventCount||0),0);
    showToast(`Loaded ${availableCals.length} calendar${availableCals.length===1?"":"s"}, ${total} event${total===1?"":"s"} in window ✓`);
    return true;
  }catch(err){
    console.error("Could not load Google calendars/colors",err);
    showToast("Could not load Google options. Check console.");
    return false;
  }
}

const DRIVE_BACKUP_FILE_NAME="schedule-planner-backup.json";

function makeDriveBackupPayload(){
  normalizeSettings();
  return {
    app:"Schedule Planner",
    version:1,
    exportedAt:new Date().toISOString(),
    data:D,
    settings:SETT
  };
}

function applyDriveBackupPayload(payload){
  if(!payload||!payload.data||!payload.data.projects||!payload.data.meetings||!payload.data.categories){
    throw new Error("Invalid Schedule Planner backup file.");
  }
  D=payload.data;
  if(payload.settings){
    const keepConnected=SETT.calendarConnected;
    SETT={...SETT,...payload.settings};
    SETT.calendarConnected=keepConnected;
  }
  normalizeSettings();
}

async function findDriveBackupFile(){
  if(!ensureGoogleReady('drive'))return null;
  const res=await gapi.client.drive.files.list({
    spaces:"appDataFolder",
    q:`name='${DRIVE_BACKUP_FILE_NAME}' and trashed=false`,
    fields:"files(id,name,modifiedTime)"
  });
  const files=res.result.files||[];
  return files[0]||null;
}

async function savePlannerToDrive(){
  if(!ensureGoogleReady('drive'))return;
  try{
    const existing=await findDriveBackupFile();
    if(existing){
      const when=existing.modifiedTime?tinyTime(existing.modifiedTime):"an earlier time";
      const ok=confirm("A Google Drive backup already exists from "+when+".\n\nSaving now will replace that Drive backup with this device's current planner. Continue?");
      if(!ok){
        showToast("Drive save canceled.");
        return;
      }
    }
    const metadata={name:DRIVE_BACKUP_FILE_NAME,parents:["appDataFolder"]};
    const payload=JSON.stringify(makeDriveBackupPayload());
    const boundary="schedule_planner_boundary_"+Date.now();
    const delimiter="\r\n--"+boundary+"\r\n";
    const closeDelim="\r\n--"+boundary+"--";
    const body=
      delimiter+
      "Content-Type: application/json; charset=UTF-8\r\n\r\n"+
      JSON.stringify(existing?{name:DRIVE_BACKUP_FILE_NAME}:metadata)+
      delimiter+
      "Content-Type: application/json; charset=UTF-8\r\n\r\n"+
      payload+
      closeDelim;

    const path=existing
      ? "/upload/drive/v3/files/"+existing.id+"?uploadType=multipart"
      : "/upload/drive/v3/files?uploadType=multipart";
    const method=existing?"PATCH":"POST";

    await gapi.client.request({
      path,
      method,
      headers:{"Content-Type":"multipart/related; boundary="+boundary},
      body
    });

    SETT.lastDriveSavedAt=new Date().toISOString();
    addSyncLog("Saved planner backup to Google Drive.","success");
    await saveSett();
    render();
    showToast("Saved to Google Drive ✓");
  }catch(err){
    console.error("Google Drive save failed:",err);
    showToast("Google Drive save failed. Check console.");
  }
}

async function loadPlannerFromDrive(){
  if(!ensureGoogleReady('drive'))return;
  try{
    const file=await findDriveBackupFile();
    if(!file){
      showToast("No Google Drive backup found.");
      return;
    }
    if(!confirm("Load planner backup from Google Drive? This will replace the planner data on this device."))return;

    const res=await gapi.client.drive.files.get({
      fileId:file.id,
      alt:"media"
    });

    const payload=typeof res.body==="string"?JSON.parse(res.body):res.result;
    applyDriveBackupPayload(payload);
    await sv();
    SETT.lastDriveLoadedAt=new Date().toISOString();
    addSyncLog("Loaded planner backup from Google Drive.","success");
    await saveSett();
    render();
    showToast("Loaded from Google Drive ✓");
  }catch(err){
    console.error("Google Drive load failed:",err);
    showToast("Google Drive load failed. Check console.");
  }
}

async function checkDriveBackupStatus(){
  if(!ensureGoogleReady('drive'))return;
  try{
    const file=await findDriveBackupFile();
    if(file){
      SETT.lastDriveBackupModifiedAt=file.modifiedTime||null;
      await saveSett();
      render();
      showToast("Drive backup found: "+tinyTime(file.modifiedTime));
    }else{
      showToast("No Drive backup found.");
    }
  }catch(err){
    console.error("Google Drive status check failed:",err);
    showToast("Could not check Drive backup.");
  }
}

  let y=parseInt(m[1],10);
  if(!Number.isFinite(y))return s;
  if(y<100)y=2000+y;
  else if(y<1000)y=2000+(y%100);

  const da=String(parseInt(m[4],10)).padStart(2,'0');
  const hh=String(parseInt(m[5]||'9',10)).padStart(2,'0');
  const mm=String(parseInt(m[6]||'00',10)).padStart(2,'0');
  return withTime?`${y}-${mo}-${da}T${hh}:${mm}`:`${y}-${mo}-${da}`;
}

function handleGlobalKey(e){
if(e.altKey&&!e.ctrlKey&&!e.metaKey){if(e.key==="ArrowLeft"){e.preventDefault();navBack();return;}if(e.key==="ArrowRight"){e.preventDefault();navForward();return;}if(e.key==="ArrowUp"){e.preventDefault();moveSidebarSelection(-1);return;}if(e.key==="ArrowDown"){e.preventDefault();moveSidebarSelection(1);return;}}
if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==="ArrowUp"||e.key==="ArrowDown")&&(document.activeElement?.closest?.('.nbinner')||editNote)){e.preventDefault();focusNoteNeighbor(e.key==="ArrowDown"?1:-1);return;}
if(e.ctrlKey||e.metaKey){const k=e.key.toLowerCase();
if(k==='b'||k==='i'||k==='u'){const el=document.activeElement;if(el&&el.contentEditable==='true'){e.preventDefault();document.execCommand({b:'bold',i:'italic',u:'underline'}[k],false,null);if(el.id==='nni')newNT=ceGetText(el);else if(el.id==='nedit')editTxt=ceGetText(el);else if(el.id==='subinp')subTxt=ceGetText(el);return;}}
if(k==="z"&&!e.shiftKey){e.preventDefault();undo();return;}if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo();return;}
if(k==="s"){e.preventDefault();if(SETT.driveConnected){savePlannerToDrive();}else{connectGoogleDrive();}return;}
if(k==="d"){e.preventDefault();mode=mode==="due"?"detail":"due";render();return;}
if(k==="n"){e.preventDefault();const t=sel?.type||_lastType;startAdding(t==="meeting"?"meeting":"project");return;}
if(k==="m"){e.preventDefault();startAdding("meeting");return;}
if(k==="p"){e.preventDefault();startAdding("project");return;}
if(k==="c"){e.preventDefault();if(noteSelection.size>0)copySelectedNotes();else if(!adding&&sel&&!editNote&&!menuState)copyItem();return;}
if(k==="a"&&document.activeElement?.closest?.('.nbinner')){const ae=document.activeElement;if(ae.contentEditable!=='true'){e.preventDefault();const item=getItem();if(item){if(ae.closest('.old-section')||ae.closest('.old-row')){oldNoteSelection=new Set((item.oldNotes||[]).map(n=>n.id));lastOldNoteClick=[...oldNoteSelection][0]||null;noteSelection.clear();lastNoteClick=null;}else{flattenNotes(item.notes||[]).forEach(n=>noteSelection.add(n.id));oldNoteSelection.clear();lastOldNoteClick=null;}}render();return;}}
}
if(e.key==="Escape"){if(adding){adding=null;render();return;}if(showCatPkr||showProjPkr||showMtgPkr){showCatPkr=false;showProjPkr=false;showMtgPkr=false;render();return;}if(editNote){editNote=null;editTxt="";editLinkUrl="";render();return;}if(isMobileLayout()&&mobileSidebarOpen){mobileSidebarOpen=false;render();return;}if(noteSelection.size>0){noteSelection.clear();lastNoteClick=null;render();return;}if(oldNoteSelection.size>0){oldNoteSelection.clear();lastOldNoteClick=null;render();return;}if(duePickerFor){duePickerFor=null;render();return;}if(editingTitle){editingTitle=false;render();return;}if(editingCatId){editingCatId=null;editingCatName="";render();return;}if(_subCtx){_subCtx=null;insertAfter=null;render();return;}if(_clearStep>0){_clearStep=0;_clearInput="";render();return;}if(menuState&&menuState!=="menu"){menuState="menu";render();return;}if(menuState==="menu"){menuState=null;render();return;}}
if(!e.altKey)return;
const skip=["ftitle","fdate","fduration","nci","date-inp","duration-inp","title-edit","cat-name-edit"];
if(document.activeElement&&skip.includes(document.activeElement.id))return;
const k=e.key.toLowerCase();if(k==="t"){e.preventDefault();switchType("task");}if(k==="b"){e.preventDefault();switchType("bullet");}if(k==="x"){e.preventDefault();switchType("text");}if(k==="h"){e.preventDefault();switchType("header");}if(k==="l"){e.preventDefault();switchType("link");}
}

function focusNNI(){const n=document.getElementById("nni");if(!n)return;if(n.contentEditable==='true')ceFocusEnd(n);else{n.focus();if(n.value!==undefined)n.selectionStart=n.selectionEnd=n.value.length;}n.scrollIntoView({behavior:"smooth",block:"nearest"});}

if(addSubFor){if(pnl)pnl.scrollTop=_pnlY;const f=document.getElementById("subinp");if(f)setTimeout(()=>ceFocusEnd(f),0);return;}
if(adding){document.getElementById("ftitle")?.focus();return;}
if(mode==="cats"){if(editingCatId){setTimeout(()=>{const f=document.getElementById("cat-name-edit");if(f){f.focus();f.select();}},0);return;}document.getElementById("nci")?.focus();return;}
if(mode==="due"){const f=document.getElementById("due-filter");if(f)f.focus();return;}
if(_scrollToNote){const el=document.querySelector('[data-nid="'+_scrollToNote+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});_scrollToNote=null;setTimeout(()=>focusNNI(),0);return;}

function rBins(b){const dv='<div style="height:0.5px;background:var(--color-border-tertiary)"></div>';let ind="";if(binCatFilter.size>0||binCatIncludeUncat){const dots=[...binCatFilter].map(id=>{const c=getCat(id),sc=getSubcat(id);return c?mainCatDot(c):(sc?subcatMark(sc):"")}).join("")+(binCatIncludeUncat?'<span style="font-size:10px;color:var(--color-text-tertiary);border:0.5px dashed var(--color-border-secondary);border-radius:99px;padding:0 5px">Uncategorized</span>':"");ind='<div style="display:flex;align-items:center;gap:4px;padding:2px 0 5px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:.2rem"><span style="font-size:10px;color:var(--color-text-tertiary)">Filtering</span>'+dots+'<button data-a="clear-bin-filter" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--color-text-tertiary);margin-left:auto;padding:0">clear</button></div>';}return ind+[rBin("Active projects","#c97d30",b.active,"project",true,false,"project:active-projects"),dv,rBin("Completed projects","#888",b.done,"project",false,false,"project:completed-projects"),dv,rBin("Upcoming meetings","#1D9E75",b.upcoming,"meeting",true,false,"meeting:upcoming-meetings"),dv,rBin("Past meetings","#5F9EC5",b.past,"meeting",false,true,"meeting:past-meetings")].join("");}
function rBin(label,color,items,type,canAdd,isPast,key){
  normalizeSettings();
  key=key||binCollapseKey(label,type);
  const collapsed=!!SETT.collapsedBins[key];
  const add=canAdd?'<button class="ib" data-a="add-'+type+'">+</button>':"";
  const maxH=SETT.itemsPerSection>0?"max-height:"+SETT.itemsPerSection*52+"px;overflow-y:auto":"";
  const groupedMeetings=type==="meeting"&&SETT.intuitiveSortMeetings;
  const groupedActiveProjects=type==="project"&&label==="Active projects"&&SETT.intuitiveSortProjects;
  let list=items;
  if(groupedMeetings)list=groupByDate(items);
  else if(groupedActiveProjects)list=groupByCat(items);
  let hideGroup=null,hideCat=false;
  const renderCard=(item)=>{
    if(item.header){
      const gkey=groupCollapseKey(key,item.groupKey);
      const gcol=!!SETT.collapsedGroups[gkey];
      if(type==="meeting"){
        hideGroup=gcol?gkey:null;
        return '<div class="bin-subheader '+(gcol?'grp-closed':'grp-open')+'" data-a="toggle-group-collapse" data-key="'+esc(gkey)+'" title="Click to collapse or expand"><span>'+esc(item.header)+'</span><span class="day">'+esc(item.day||"")+'</span><span class="chev">'+(gcol?'▸':'▾')+'</span></div>';
      }
      hideGroup=null;hideCat=gcol;
      const hc=item.catId?getCat(item.catId):null;
      return '<div class="bin-subheader '+(gcol?'grp-closed':'grp-open')+'" data-a="toggle-group-collapse" data-key="'+esc(gkey)+'" title="Click to collapse or expand">'+(hc?mainCatDot(hc,'cat-header-dot'):'')+'<span>'+esc(item.header)+'</span><span class="chev">'+(gcol?'▸':'▾')+'</span></div>';
    }
    if(item.subheader)return "";
    if(hideGroup||hideCat)return "";
    const isSel=sel?.id===item.id;
    const dots=groupedActiveProjects?itemSubcats(item).map(subcatMark).join(""):itemCategoryMarks(item,type==="meeting");
    const baseMeta=item.date?(groupedMeetings?ftOnly(item.date):fts(item.date)):(item.completedAt?"Done "+fd(item.completedAt):(item.notes||[]).length+" notes");
    const meta=baseMeta+(dots?' <span style="display:inline-flex;gap:3px;vertical-align:middle;align-items:center">'+dots+'</span>':'');
    const syncFlag=item.googleMissing?' <span style="color:var(--color-text-warning);font-weight:600">⚠ calendar?</span>':item.syncConflict?' <span style="color:var(--color-text-warning);font-weight:600">⚠ unsynced</span>':(item.googleEventId?' <span style="color:var(--color-text-success)">↔</span>':'');
    const recurIcon=type==="meeting"&&item.recurringWeekly?' <i class="ti ti-repeat recurring-mark" title="Repeats weekly"></i>':'';
    const nameCls=item.completed?" dn":isPast?" past":"";
    return '<div class="ic'+(isSel?" sel":"")+'" data-id="'+item.id+'" data-type="'+type+'" draggable="true"><div class="iname'+nameCls+'">'+esc(item.title)+recurIcon+'</div><div class="imeta">'+meta+syncFlag+'</div></div>';
  };
  const cards=collapsed?"":(items.length===0?'<div class="empty">'+((binCatFilter.size>0||binCatIncludeUncat)?"None match filter":"Nothing here")+'</div>':list.map(renderCard).join(""));
  return '<div><div class="bhdr"><div class="blbl" data-a="toggle-bin-collapse" data-key="'+esc(key)+'" title="Click to collapse or expand"><div class="abar '+(collapsed?'closed':'open')+'" style="background:'+color+'"></div><span class="btit">'+label+'</span><span class="bcnt">'+items.length+'</span></div>'+add+'</div><div data-bin="'+type+'" style="'+(collapsed?'display:none;':maxH)+'">'+cards+'</div></div>';
}

async function doExportCal(){let ms=D.meetings;const now=new Date();if(_expMode==="upcoming")ms=ms.filter(m=>new Date(m.date)>=now);else if(_expMode==="select")ms=ms.filter(m=>_expSelIds.has(m.id));if(!ms.length){showToast("No events to export");return;}function toICS(d){const p=n=>String(n).padStart(2,"0");return""+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00";}const ln=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Workspace//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];ms.forEach(m=>{const s=new Date(m.date),e=new Date(+s+meetingDurationMins(m)*60000);const desc=m.syncNotes&&(m.notes||[]).length?notesToPlainText(m.notes).join('\n'):'';ln.push("BEGIN:VEVENT","UID:"+m.id+"@workspace","DTSTAMP:"+toICS(new Date()),"DTSTART:"+toICS(s),"DTEND:"+toICS(e),"SUMMARY:"+m.title);if(desc)ln.push("DESCRIPTION:"+desc.replace(/\n/g,'\\n'));ln.push("END:VEVENT");});ln.push("END:VCALENDAR");const r=await savePickFile(ln.join("\r\n"),"calendar-export.ics","ics");if(r.saved)showToast("Exported "+ms.length+" events \u2713");}
async function doExportFull(){const r=await savePickFile(JSON.stringify(D,null,2),"workspace-export.json","json");if(r.saved)showToast("Exported \u2713");}
function loadImportFile(file){const r=new FileReader();r.onload=e=>{try{const p=JSON.parse(e.target.result);if(!p.projects&&!p.meetings){_impErr="Invalid file";render();return;}_impData=p;_impErr="";const ep=new Set(D.projects.map(p=>p.id)),em=new Set(D.meetings.map(m=>m.id));const dupes=[];(p.projects||[]).forEach(p=>{if(ep.has(p.id))dupes.push({type:"project",item:p,reason:"Same ID"});});(p.meetings||[]).forEach(m=>{if(em.has(m.id))dupes.push({type:"meeting",item:m,reason:"Same ID"});});_impDupes=dupes;_impSkip=new Set(dupes.map(d=>d.item.id));render();}catch{_impErr="Could not parse file";render();}};r.readAsText(file);}
function doImport(){if(!_impData)return;pushHistory();const sk=_impSkip;D.projects=[...D.projects,...(_impData.projects||[]).filter(p=>!sk.has(p.id))];D.meetings=[...D.meetings,...(_impData.meetings||[]).filter(m=>!sk.has(m.id))];D.categories=[...D.categories,...(_impData.categories||[]).filter(c=>!D.categories.find(e=>e.id===c.id))];_impData=null;_impDupes=[];_impSkip=new Set();sv();showToast("Imported \u2713");render();}
load();

window.addEventListener("resize",()=>{if(!isMobileLayout()&&mobileSidebarOpen){mobileSidebarOpen=false;render();}});
